</head>

<body>
    <script>
        let name1 = "Matti Mainio";
        let age1 = 60;
        let name2 = "Kirsi Kernell";
        let age2 = 40;
        
        let ageDiff = Math.abs(age2 - age1);

        if (age1 < age2) {
            console.log(`${name2} is ${ageDiff} years older than ${name1}`);
        }

        if (age1 > age2) {
            console.log(`${name1} is ${ageDiff} years older than ${name2}`);
        }

        if (age1 === age2) {
            console.log(`${name1} and ${name2} are the same age`);
        }
    </script>
