<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="results">    
        <p>OMG - Lady Gaga start singing!</p>
    </div>

    <script>
        let manyFireworks = 0
        let results = document.getElementById('results')

        function niceFireworks() {
            if (manyFireworks >= 5) {
                // Final message printed after 2 seconds, takes 7 in total after final fireworks.
                setTimeout(() => {
                    results.innerHTML += `<p>WOW - It was the best concert in my life...</p>`
                }, 2000)
                clearInterval(fireworkInterval)
                return
            }

            results.innerHTML += `<p>NICE - fireworks!</p>`
            manyFireworks++
        }

        let fireworkInterval = setInterval(niceFireworks, 5000)
    </script>

</body>
</html>
