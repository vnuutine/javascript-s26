<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <h2>Guess game</h2>
            <p>Try to guess a number between 1 and 100</p>
            <form>
                <label for="num">Give a number:</label>
                <input type="number" id="num" name="num"><br><br>
                <input type="submit" value="Submit">

            </form>
        </div>

        <div class="output">
            <div id="results"></div>
        </div>
    </div>


    <script>
        let results = document.getElementById('results')

        const randomNumber = Math.floor(Math.random() * 100) + 1
        let counter = 0

        let form = document.querySelector('form')
        form.addEventListener('submit', function(event) {
            event.preventDefault()
            
            let num = document.getElementById('num').value
            
            if (num < 1 || num > 100) {
                results.innerHTML = 'Please give a number between 1 and 100'
                return
            }

            counter++
            
            if (num < randomNumber) {
                results.innerHTML = 'Your number is too low'
            } else if (num > randomNumber) {
                results.innerHTML = 'Your number is too high'
            } else {
                results.innerHTML = 'You guessed the number!'
                results.innerHTML += '<br>And it took you ' + counter + ' tries!'
            }
        })

    </script>

</body>
</html>
