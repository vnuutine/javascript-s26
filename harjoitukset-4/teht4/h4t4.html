<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="inputs">

            <label for="colors">Valitse juhlaväri:</label>
            <select name="colors" id="colors">
                <option disabled selected value="">Valitse väri</option>
                <option value="#FF0000">Punainen</option>
                <option value="#FFFF00">Keltainen</option>
                <option value="#0000FF">Sininen</option>
                <option value="#008000">Vihreä</option>
            </select>

            <label for="userInput">Mikä juhla?</label>
            <input type="text" id="userInput" name="userInput">
        </div>

        <div class="buttons">
            <button id="print">Vaihda valittu taustaväri</button>
        </div>

        <div class="results">
            <h4>Tulosalue</h4>
            <p id="colorCode">Valittu: </p>
            <p id="event"></p>
        </div>
    </div>
    
    <script>
        const colorCode = document.getElementById("colorCode")
        const eventText = document.getElementById("event")
        const printButton = document.getElementById("print")
        const dropdown = document.getElementById("colors")
        const results = document.querySelector(".results")

        printButton.addEventListener("click", changeBg)

        dropdown.addEventListener("change", (event) => {
            colorCode.textContent = `Valittu: ${event.target.value}, ${event.target.options[event.target.selectedIndex].text}`
        })

        const liveInput = document.getElementById("userInput")
        liveInput.addEventListener("input", (e) => {
            const cleaned = e.target.value.replace(/\d/g, "")
            e.target.value = cleaned
            eventText.textContent = cleaned
        })

        function changeBg() {
            results.style.backgroundColor = dropdown.value
        }

    </script>
</body>
</html>
