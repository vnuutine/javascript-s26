<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
    </script>
    <title>Document</title>
</head>

<body>
    <div id="map"></div>

    <script>
        const map = L.map("map").setView([65.24, 25.74], 5)

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map)

    const savonlinna = L.marker([61.868, 28.886]).addTo(map)
    const rovaniemi = L.marker([66.5030, 25.7269]).addTo(map)
    const lappeenranta = L.marker([61.0587, 28.1887]).addTo(map)
    const helsinki = L.marker([60.1708, 24.9375]).addTo(map)
    const turku = L.marker([60.4515, 22.2687]).addTo(map)
    
    savonlinna.bindPopup("Savonlinna")
    rovaniemi.bindPopup("Rovaniemi")
    lappeenranta.bindPopup("Lappeenranta")
    helsinki.bindPopup("Helsinki")
    turku.bindPopup("Turku")
    </script>
</body>
</html>
