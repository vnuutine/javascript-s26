<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

    <link rel="stylesheet" href="styles.css"/>

    <title>Golf courses</title>

<body>
    <div id="map"></div>

    <script>
        const map = L.map("map").setView([61.70, 25.00], 7)

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map)

        async function init() {
            const coursesList = await getCourses()
            renderPlaces(coursesList)
        }

        async function getCourses() {
            let response = await fetch("courses.json")
            let data = await response.json()
            return data
        }

        function drawPlace(course) {
            const marker = L.marker([course.lat, course.lng]).addTo(map)
            marker.bindPopup(course.course)
        }

        function renderPlaces(list) {
            for (const place of list) {
                drawPlace(place)
            }
        }
