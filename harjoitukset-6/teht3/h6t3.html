<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <link rel="stylesheet" href="styles.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <title>Golf courses</title>
</head>

<body>
    <div id="map"></div>

    <script>
        const map = L.map("map").setView([61.70, 25.00], 7)

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map)

        async function init() {
            const coursesList = await getCourses()
            renderPlaces(coursesList)
        }

        async function getCourses() {
            const response = await fetch("courses.json")
            const data = await response.json()
            return data
        }

        function drawPlace(course) {
            const marker = L.marker([course.lat, course.lng])
            marker.addTo(clusters)
            marker.bindPopup(popupHtml(course))
        }

        function renderPlaces(list) {
            for (const place of list) {
                drawPlace(place)
            }
        }

        function popupHtml(course) {
            return `
                <h3>${course.course}</h3>
                <p><strong>Address: </strong>${course.address}</p>
                <p><strong>Phone: </strong><a href="tel:${course.phone}">${course.phone}</a></p>
                <p><strong>Email: </strong><a href="mailto:${course.email}">${course.email}</a></p>
                <p><strong>Webpage: </strong><a href="${course.web}" target="_blank">${course.web}</a></p>
                <p>${course.text}</p>`
        }

        const clusters = L.markerClusterGroup({
            maxClusterRadius: 60
        })
        map.addLayer(clusters)

        init()
        
    </script>
</body>
</html>
